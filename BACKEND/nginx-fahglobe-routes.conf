# GlobeTrotter Yaoundé — API routes for the existing HTTPS server block.
# Paste these location blocks INSIDE the `server { ... }` block that serves
# fahglobe.duckdns.org, then run: sudo nginx -t && sudo systemctl reload nginx
#
# All backend traffic goes through the API Gateway, which Docker publishes only
# on 127.0.0.1:4200. Do NOT proxy to :8001..:8005 from Nginx.

# WebSocket: required by Global Chat.
location = /ws/chat {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Chat REST + uploaded media.
location ^~ /chat/ {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 55m;
    proxy_read_timeout 90s;
}

location ^~ /static/chat_uploads/ {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Host $host;
}

# Direct-message media.
location ^~ /static/message_images/ {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Host $host;
}

# Destination images are also served by the gateway.
location ^~ /static/images/ {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Host $host;
}

# User/social routes. Missing /users and /follow is exactly what makes the
# online app show zero/empty followers even though the backend contains users.
location ~ ^/(register|login|auth|me|reviews|favorites|users|notifications|follow|messages|itineraries|recommendations|destinations|categories|assistant|health)(/|$) {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 55m;
    proxy_read_timeout 90s;
}
