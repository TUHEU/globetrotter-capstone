name: globetrotter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.0.0
  google_sign_in_web: ^1.1.0
  geolocator: ^14.0.3
  flutter_compass: ^0.8.1
  share_plus: ^13.3.0
  maplibre_gl: ^0.26.2
  web: ^1.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.1
  file_picker: ^12.1.3
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  record: ^6.2.0
  emoji_picker_flutter: ^4.4.0
  intl: ^0.20.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F5A2E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F5A2E"
    theme_color: "#0F5A2E"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256