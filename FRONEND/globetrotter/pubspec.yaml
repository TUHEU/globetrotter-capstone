name: globetrotter
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  dio: ^5.11.0

  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  geolocator: ^14.0.3

  # Keep MapLibre pinned for compatibility
  maplibre_gl: 0.26.2

  share_plus: ^13.3.0
  flutter_compass: ^0.8.1
  web: ^1.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  audioplayers: ^6.8.1
  web_socket_channel: ^3.0.3
  record: ^7.1.1
  intl: ^0.20.3
  file_picker: ^12.1.3
  emoji_picker_flutter: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# ============================================================
# FLUTTER LAUNCHER ICONS
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.png"

  min_sdk_android: 21

  adaptive_icon_background: "#0F5A2E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F5A2E"
    theme_color: "#0F5A2E"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256